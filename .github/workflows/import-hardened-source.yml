name: Import hardened WhatsApp Connect Pro source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-hardened-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone hardened source repository
        run: |
          git clone --depth 1 https://github.com/mistersingh1000-dev/whatsappapi-connect-pro-codecraftmarketing.git /tmp/source
          rm -rf /tmp/source/.git

      - name: Replace destination with hardened source
        run: |
          rsync -a --delete --exclude='.git' /tmp/source/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import hardened production website source"
          git push origin HEAD:main
